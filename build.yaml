# Plugin identity (read by scripts/manifest.py; also compatible with jprm).
name: "Ducks"
guid: "6f3c2b1e-8d4a-4c7e-9b2f-d0c5a1e4f7b3"
version: "0.2.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
owner: "jellyfin-ratings"
category: "General"
description: "Rate anything 0-4 ducks and write short reviews. Requires the File Transformation plugin."
overview: >
  Adds user ratings (0 to 4 ducks, half ducks allowed) and optional short reviews to every movie, show,
  season and episode. Shows your rating and everyone's average on the details page, an average badge on
  posters, and a Reviews tab with a feed of all reviews. Data lives in Jellyfin's data folder with daily
  backups, so it survives server and plugin updates.
artifacts:
  - "Jellyfin.Plugin.Ducks.dll"
changelog: >
  See GitHub releases.
